version: 2.1

jobs:
  build:
    docker:
      - image: node:14
    #working_directory: ~/repo

    steps:
      - checkout

      # Récupérer les dépendances de l'application
      - run:
          name: Install dependencies
          command: npm install

      # Exécuter les tests
      - run:
          name: Run tests
          command: npm test

      - setup_remote_docker:
          docker_layer_caching: true

      - setup_remote_docker:
          version: default

      - run:
          name: Build Docker image
          command: docker build -t my-node-app .

workflows:
  version: 2
  build_and_test:
    jobs:
      - build