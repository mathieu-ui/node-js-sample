version: 2.1

jobs:
  build:
    docker:
      - image: circleci/node:14
    #working_directory: ~/repo

    steps:
      - checkout

      # Récupérer les dépendances de l'application
      - run:
          name: Install dependencies
          command: npm install

      # Exécuter les tests
      - run:
          name: Run tests
          command: npm test

      # Construire l'image Docker
      #- setup_remote_docker:
       #   version: 20.10.7
      - run:
          name: Build Docker image
          command: docker build -t my-node-app .

workflows:
  version: 2
  build_and_test:
    jobs:
      - build